<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance Tracker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <!-- Auth Section -->
    <div id="authSection" class="auth-section">
      <div class="auth-container">
        <h1>Attendance Tracker</h1>
        
        <!-- Login Form -->
        <div id="loginForm" class="form-group">
          <h2>Login</h2>
          <input type="email" id="loginEmail" placeholder="Email" class="input-field">
          <input type="password" id="loginPassword" placeholder="Password" class="input-field">
          <button onclick="login()" class="btn btn-primary">Login</button>
          <p class="toggle-text">Don't have an account? <a onclick="toggleForms()">Register</a></p>
        </div>

        <!-- Register Form -->
        <div id="registerForm" class="form-group hidden">
          <h2>Register</h2>
          <input type="text" id="regName" placeholder="Full Name" class="input-field">
          <input type="email" id="regEmail" placeholder="Email" class="input-field">
          <input type="password" id="regPassword" placeholder="Password" class="input-field">
          <button onclick="register()" class="btn btn-primary">Register</button>
          <p class="toggle-text">Already have an account? <a onclick="toggleForms()">Login</a></p>
        </div>
      </div>
    </div>

    <!-- Main App Section -->
    <div id="appSection" class="app-section hidden">
      <nav class="navbar">
        <div class="nav-brand">📋 Attendance Tracker</div>
        <div class="nav-user">
          <span id="userName"></span>
          <button onclick="logout()" class="btn btn-logout">Logout</button>
        </div>
      </nav>

      <div class="container">
        <div class="grid">
          <!-- Mark Attendance Section -->
          <div class="card">
            <h2>📅 Mark Attendance</h2>
            <input type="date" id="attendanceDate" class="input-field">
            <select id="attendanceStatus" class="input-field">
              <option value="present">Present</option>
              <option value="absent">Absent</option>
              <option value="leave">On Leave</option>
            </select>
            <textarea id="attendanceNotes" placeholder="Notes (optional)" class="input-field"></textarea>
            <button onclick="markAttendance()" class="btn btn-primary">Submit Attendance</button>
          </div>

          <!-- Statistics Section -->
          <div class="card">
            <h2>📊 Statistics</h2>
            <div id="statsContainer" class="stats">
              <p>Loading...</p>
            </div>
          </div>
        </div>

        <!-- Attendance History Section -->
        <div class="card">
          <h2>📝 Attendance History</h2>
          <div class="filter-group">
            <input type="month" id="monthFilter" class="input-field" style="max-width: 200px;">
            <button onclick="filterAttendance()" class="btn btn-secondary">Filter</button>
          </div>
          <div id="attendanceList" class="attendance-list">
            <p>Loading...</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
